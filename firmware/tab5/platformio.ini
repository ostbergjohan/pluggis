; Pluggis på M5Stack Tab5 (ESP32-P4 + ESP32-C6 för WiFi)
; Bygg: pio run   ·   Flasha: pio run -t upload   ·   Logg: pio device monitor
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; Tab5 har 16 MB flash – typsnitten med å, ä, ö tar plats (src/fonts, Atkinson Hyperlegible)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Ljudsvar (wav per mening) kommer som en binär WebSocket-ram – tillåt upp till 2 MB
    -DWEBSOCKETS_MAX_DATA_SIZE=2097152
    ; Gränssnittet ritas med LVGL 9 (inställningar i include/lv_conf.h)
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Version (sätts av CI, t.ex. 2026.11.27.1430-ab12cd3; lokalt tom = "egen" + datum)
    '-DPLUGGIS_FW_VERSION="${sysenv.PLUGGIS_FW_VERSION}"'
lib_deps =
    m5stack/M5Unified@^0.2.17
    m5stack/M5GFX@^0.2.22
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    lvgl/lvgl@~9.2.2
