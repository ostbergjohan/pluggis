name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Kompilera och testa
        run: mvn -B verify
      - name: Testrapporter vid fel
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -l -E "FAILURE|ERROR" "$f" >/dev/null && { echo "== $f"; cat "$f"; }
          done || true

  web-and-speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kontrollera webbgränssnittets JavaScript
        run: node --check src/main/resources/static/app.js && node --check src/main/resources/static/chat.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kontrollera ljudtjänsten
        run: python -m py_compile speech/app.py
