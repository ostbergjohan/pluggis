name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pom.xml
      - speech/**
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg Pluggis och ljudtjänsten
        env:
          ANTHROPIC_API_KEY: ci-dummy
        run: docker compose build
      - name: Starta ljudtjänsten och prova tal ↔ text
        run: |
          docker run -d --name speech -p 8090:8090 "$(docker compose images -q speech 2>/dev/null || echo pluggis-speech)" || \
            docker run -d --name speech -p 8090:8090 pluggis-speech
          for i in $(seq 1 60); do curl -fs localhost:8090/health && break; sleep 2; done
          curl -fs localhost:8090/voices; echo
          for v in $(curl -fs localhost:8090/voices | python3 -c "import sys,json; print(' '.join(x['id'] for x in json.load(sys.stdin)))"); do
            curl -fs -X POST localhost:8090/tts -H 'Content-Type: application/json' \
              -d "{\"text\":\"Hej! Nu kör vi första uppgiften.\",\"voice\":\"$v\"}" -o "$v.wav"
            echo "$v: $(stat -c %s "$v.wav") byte → $(curl -fs -X POST localhost:8090/stt -F audio=@"$v.wav")"
          done
          docker logs speech | tail -20
