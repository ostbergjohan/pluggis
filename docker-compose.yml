# Allt på en maskin:
#   cp .env.example .env      # fyll i ANTHROPIC_API_KEY och PLUGGIS_ADMIN_PASSWORD
#   docker compose up --build
# Öppna sedan http://localhost:8080
#
# .env är valfri (kräver Docker Compose 2.24+). Utan den kan värdena sättas i skalet:
#   ANTHROPIC_API_KEY=sk-ant-... PLUGGIS_ADMIN_PASSWORD=hemligt docker compose up --build
services:
  pluggis:
    build: .
    ports:
      - "8080:8080"
      # Metrik för Prometheus/Grafana – bara från den här datorn, aldrig utifrån
      - "127.0.0.1:9091:9091"
    env_file:
      - path: .env
        required: false
    environment:
      # Antingen API-nyckel, eller PLUGGIS_CLAUDE_BACKEND=claude-code + CLAUDE_CODE_OAUTH_TOKEN (abonnemanget).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLUGGIS_CLAUDE_BACKEND: ${PLUGGIS_CLAUDE_BACKEND:-api}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PLUGGIS_CLAUDE_API_PURPOSES: ${PLUGGIS_CLAUDE_API_PURPOSES:-coach}
      # Valfritt: Google Kalender. Lägg nyckeln som ./secrets/google-sa.json (monteras nedan).
      PLUGGIS_GOOGLE_SA_FILE: ${PLUGGIS_GOOGLE_SA_FILE:-/app/secrets/google-sa.json}
      # Valfritt: Azures svenska röster (gratisnivån F0). Tomt = bara Piper.
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-swedencentral}
      # Lösenord till föräldravyn (första gången, eller nytt om det glömts). Sparas krypterat; kan tas bort efteråt.
      PLUGGIS_ADMIN_PASSWORD: ${PLUGGIS_ADMIN_PASSWORD:-}
      PLUGGIS_SPEECH_URL: http://speech:8090
    volumes:
      - pluggis-data:/app/data
      # Hemligheter som filer (t.ex. Google-nyckeln). Mappen finns med i git men innehållet ignoreras.
      - ./secrets:/app/secrets:ro
    depends_on:
      - speech

  speech:
    build: ./speech
    environment:
      STT_MODEL: KBLab/kb-whisper-small
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      PIPER_LENGTH_SCALE: "1.05"
    # Exponeras bara internt – Pluggis pratar med den, inte enheterna.

volumes:
  pluggis-data:
