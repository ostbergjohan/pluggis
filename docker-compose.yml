# Allt på en maskin:
#   cp .env.example .env      # fyll i ANTHROPIC_API_KEY och PLUGGIS_DEVICE_TOKEN
#   docker compose up --build
# Öppna sedan http://localhost:8080
#
# .env är valfri (kräver Docker Compose 2.24+). Utan den kan värdena sättas i skalet:
#   ANTHROPIC_API_KEY=sk-ant-... PLUGGIS_DEVICE_TOKEN=hemligt docker compose up --build
services:
  pluggis:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Antingen API-nyckel, eller PLUGGIS_CLAUDE_BACKEND=claude-code + CLAUDE_CODE_OAUTH_TOKEN (abonnemanget).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLUGGIS_CLAUDE_BACKEND: ${PLUGGIS_CLAUDE_BACKEND:-api}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PLUGGIS_CLAUDE_API_PURPOSES: ${PLUGGIS_CLAUDE_API_PURPOSES:-coach}
      # Valfritt: Azures svenska röster (gratisnivån F0). Tomt = bara Piper.
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-swedencentral}
      PLUGGIS_DEVICE_TOKEN: ${PLUGGIS_DEVICE_TOKEN:-}
      PLUGGIS_SPEECH_URL: http://speech:8090
    volumes:
      - pluggis-data:/app/data
    depends_on:
      - speech

  speech:
    build: ./speech
    environment:
      STT_MODEL: KBLab/kb-whisper-small
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      PIPER_LENGTH_SCALE: "1.05"
    # Exponeras bara internt – Pluggis pratar med den, inte enheterna.

volumes:
  pluggis-data:
