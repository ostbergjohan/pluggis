spring:
  application:
    name: laxcoach
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/laxcoach;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

laxcoach:
  # Delad hemlighet som Tab5 och iOS-genvägen skickar med (header X-Laxcoach-Token / ?token=).
  # Tom = ingen kontroll (bara för lokal utveckling).
  device-token: ${LAXCOACH_DEVICE_TOKEN:}
  timezone: Europe/Stockholm
  # Hur många meddelanden coachen minns per enhet innan äldre plockas bort.
  max-history-messages: 30
  # Efter så här många minuters tystnad börjar en ny konversation.
  conversation-idle-minutes: 30
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    api-version: "2023-06-01"
    # Röst kräver låg latens – byt gärna till en Haiku-modell och mät.
    model: ${LAXCOACH_MODEL:claude-sonnet-5-5}
    vision-model: ${LAXCOACH_VISION_MODEL:claude-sonnet-5-5}
    max-tokens: 400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    se.ostberg.laxcoach: INFO
