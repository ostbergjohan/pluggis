spring:
  application:
    name: pluggis
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/pluggis;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

pluggis:
  # Delad hemlighet som Tab5 och iOS-genvägen skickar med (header X-Pluggis-Token / ?token=).
  # Tom = ingen kontroll (bara för lokal utveckling).
  device-token: ${PLUGGIS_DEVICE_TOKEN:}
  timezone: Europe/Stockholm
  # Hur många meddelanden coachen minns per enhet innan äldre plockas bort.
  max-history-messages: 30
  # Efter så här många minuters tystnad börjar en ny konversation.
  conversation-idle-minutes: 30
  planning:
    # Dagar då planen får lägga pluggmoment
    study-days: ${PLUGGIS_STUDY_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,SUNDAY}
    max-minutes-per-day: ${PLUGGIS_MAX_MINUTES_PER_DAY:40}
  calendar:
    # iCal/webcal-länk till en skolkalender, om en finns. Tom = av.
    ical-url: ${PLUGGIS_ICAL_URL:}
    horizon-days: 60
    sync-cron: "0 5 * * * *"
  reminders:
    enabled: ${PLUGGIS_REMINDERS_ENABLED:true}
    # sek min tim dag mån veckodag (Europe/Stockholm)
    start-cron: "0 30 16 * * MON-FRI"
    nudge-cron: "0 30 18 * * MON-FRI"
  rewards:
    # Poäng räknas alltid. Med enabled=true nämner coachen också kronor.
    enabled: ${PLUGGIS_REWARDS_ENABLED:true}
    # 0.10 kr per poäng = 10 poäng per krona
    sek-per-point: ${PLUGGIS_SEK_PER_POINT:0.10}
    # Max kronor per vecka (0 = inget tak)
    weekly-cap-sek: ${PLUGGIS_WEEKLY_CAP_SEK:50}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    api-version: "2023-06-01"
    # Röstcoachen: snabbast möjligt. Haiku 5.5, låg effort, inget förhandstänkande.
    coach:
      model: ${PLUGGIS_COACH_MODEL:claude-haiku-5-5}
      effort: ${PLUGGIS_COACH_EFFORT:low}
      thinking: ${PLUGGIS_COACH_THINKING:disabled}
      max-tokens: 400
    # Foton/skärmdumpar (handskrift, tabeller): Sonnet 5.5.
    vision:
      model: ${PLUGGIS_VISION_MODEL:claude-sonnet-5-5}
      effort: medium
      thinking: ""
      max-tokens: 2048
    # Pluggplaner: ingen väntar i realtid, kvalitet viktigare.
    planning:
      model: ${PLUGGIS_PLANNING_MODEL:claude-sonnet-5-5}
      effort: medium
      thinking: ""
      max-tokens: 3000
    flashcards:
      model: ${PLUGGIS_FLASHCARDS_MODEL:claude-sonnet-5-5}
      effort: medium
      thinking: ""
      max-tokens: 4096
  speech:
    # pluggis-speech (se speech/). Tomt = ingen ljudväg.
    base-url: ${PLUGGIS_SPEECH_URL:}
    timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    se.ostberg.pluggis: INFO
