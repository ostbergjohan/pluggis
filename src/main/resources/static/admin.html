<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <script>try { const t = localStorage.getItem('pluggis.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pluggis admin">
  <meta name="theme-color" content="#022153">
  <link rel="apple-touch-icon" href="admin-apple-touch-icon.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
  <link rel="manifest" href="admin.webmanifest">
  <title>Pluggis</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="mark-96.png" alt="" aria-hidden="true"> Pluggis</div>
    <select id="studentSel" class="student-sel" title="Vilken elev du tittar på" hidden></select>
    <nav class="tabs" id="tabs">
      <a href="#oversikt" data-view="oversikt">Översikt</a>
      <a href="#laxor" data-view="laxor">Läxor &amp; prov</a>
      <a href="#plan" data-view="plan">Plan</a>
      <a href="#elev" data-view="elev">Eleven</a>
      <a href="#system" data-view="system">System</a>
    </nav>
    <button class="ghost small theme-btn" id="theme" title="Ljust eller mörkt">◐</button>
    <div class="device-status" id="deviceStatus" title="Tab5-status" data-tab5 hidden>●</div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="subjects.js"></script>
  <script src="app.js"></script>
</body>
</html>
