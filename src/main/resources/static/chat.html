<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <script>try { const t = localStorage.getItem('pluggis.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pluggis">
  <meta name="theme-color" content="#022153">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Pluggis</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="bar">
    <div class="title"><img class="logo" src="mark-96.png" alt="" aria-hidden="true"> Pluggis</div>
    <div class="chips">
      <button class="chip" id="points" title="Poäng den här veckan">– p</button>
      <button class="chip icon" id="speak" title="Läs upp svaren" aria-pressed="false">🔇</button>
      <button class="chip icon theme-btn" id="theme" title="Ljust eller mörkt">◐</button>
      <span class="dot" id="conn" title="Anslutning"></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="chatt" class="on"><span>💬</span>Chatt</button>
    <button data-tab="plan"><span>🗓</span>Plan</button>
    <button data-tab="laxor"><span>📚</span>Läxor</button>
    <button data-tab="kort"><span>🎯</span>Öva</button>
    <button data-tab="poang"><span>⭐</span>Poäng</button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="i18n.js"></script>
  <script src="i18n-chat.js"></script>
  <script src="subjects.js"></script>
  <script src="chat.js"></script>
</body>
</html>
